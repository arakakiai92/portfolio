    <script>
        // ==================== CONFIGURATION ====================
        // 🟢 特集を公開状態に設定
        const FEATURE_COMING_SOON = false;

        const SPREADSHEET_ID = '1sZ-NHSGmmXdvwDbDnsZtWSNdGt-4W3gGxhCs6ZOdp5s';
        const GID_MASTER = '0';
        const GID_HEART = '414139365';

        // 🛑 非表示にするItem IDリスト
        const EXCLUDE_ITEM_IDS = [
            '41915904',
            '42134265',
            '42894180',
            '43204866',
            '43309479',
            '43522568',
            '540497',
            '47126076'
        ];
        // =======================================================

        // 🐞 デバッグログ（公開時は false）
        const DEBUG = /[?&]debug\b/.test(location.search);
        const dlog = (...a) => { if (DEBUG) console.log('[debug]', ...a); };

        // 📋 スプレッドシートの列名 → 内部フィールド（実データの列名に明確に対応）
        const COLUMN_MAP = {
            id: 'Item ID',
            title: '日本語タイトル',
            type: 'カテゴリ',
            url: 'ストアURL',
            img: 'サムネイルURL',
            date: '販売開始日',
            pickMonth: '推し月',
            premiumMonth: 'プレミアム月'
        };

        // 年月を YYYY-MM に統一（2026-10 / 2026/10 / 2026.10 / 2026-10-01 / 2026年10月 / 全角数字 / 10/2026 に対応）
        function normalizeYM(val) {
            if (val === null || val === undefined) return '';
            let t = String(val).replace(/^\uFEFF/, '').trim()
                .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
                .replace(/[－−ー‐–—]/g, '-');
            if (!t) return '';
            let m = t.match(/^(\d{4})\D+(\d{1,2})/);
            if (m) {
                const mon = parseInt(m[2], 10);
                return (mon >= 1 && mon <= 12) ? `${m[1]}-${String(mon).padStart(2, '0')}` : '';
            }
            m = t.match(/^(\d{1,2})\/(\d{4})$/); // 10/2026
            if (m) {
                const mon = parseInt(m[1], 10);
                return (mon >= 1 && mon <= 12) ? `${m[2]}-${String(mon).padStart(2, '0')}` : '';
            }
            return '';
        }

        // 年月が現在年月か（比較は常に YYYY-MM 同士）
        const isPickNow = s => s.pickMonth !== '' && s.pickMonth === getCurrentYM();
        const isPremiumNow = s => s.premiumMonth !== '' && s.premiumMonth === getCurrentYM();

        function getCurrentYM() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        }

        let allStamps = [];
        let currentCategory = 'okinawa';
        let currentType = 'all';
        let currentSort = 'newest';
        let searchQuery = '';
        let activeFeature = null;

        async function fetchTabCSV(gid) {
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${gid}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Fetch failed for gid: ${gid}`);
            return await response.text();
        }

        function parseCSVText(csvText) {
            return new Promise((resolve) => {
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function (results) {
                        resolve(results.data);
                    },
                    error: function () {
                        resolve([]);
                    }
                });
            });
        }

        async function fetchSpreadsheetData() {
            try {
                const [masterRaw, heartRaw] = await Promise.all([
                    fetchTabCSV(GID_MASTER).then(parseCSVText),
                    fetchTabCSV(GID_HEART).then(parseCSVText)
                ]);

                const heartMap = {};
                heartRaw.forEach(row => {
                    let itemId = '';
                    let heartCount = 0;

                    Object.keys(row).forEach(key => {
                        const k = key.trim().toLowerCase();
                        const val = row[key] ? row[key].trim() : '';
                        if (k === 'item id' || k === 'itemid' || k === 'id') {
                            itemId = val;
                        }
                        if (k.includes('ハート') || k.includes('heart')) {
                            heartCount = parseInt(val, 10) || 0;
                        }
                    });

                    if (itemId) {
                        heartMap[itemId] = heartCount;
                    }
                });

                const mappedData = masterRaw.map(row => {
                    const obj = {id: '', title: '', url: '', type: 'sticker', img: '', date: '', status: '', pickMonth: '', premiumMonth: '', rowText: '', hearts: 0, isRecommended: false, isPremium: false};

                    obj.rowText = Object.values(row).join(' ');

                    // BOM・前後空白を除いた列名で参照できるようにする
                    const clean = {};
                    Object.keys(row).forEach(key => {
                        clean[key.replace(/^\uFEFF/, '').trim()] = (row[key] || '').trim();
                    });
                    const col = name => clean[name] || '';

                    obj.id = col(COLUMN_MAP.id);
                    obj.title = col(COLUMN_MAP.title);
                    obj.url = col(COLUMN_MAP.url);
                    obj.img = col(COLUMN_MAP.img);
                    obj.date = col(COLUMN_MAP.date);
                    obj.status = col('ステータス') || col('状態') || col('Status');
                    // 年月は内部的に YYYY-MM に統一
                    // 推し月・プレミアム月は、列名が完全一致しない場合のみ「推し」「プレミアム」を含む列名で補う
                    const findCol = (name, part) => {
                        if (clean[name] !== undefined) return clean[name];
                        const k = Object.keys(clean).find(h => h.includes(part));
                        return k ? clean[k] : '';
                    };
                    obj.pickMonth = normalizeYM(findCol(COLUMN_MAP.pickMonth, '推し'));
                    obj.premiumMonth = normalizeYM(findCol(COLUMN_MAP.premiumMonth, 'プレミアム'));

                    const typeVal = col(COLUMN_MAP.type);
                    if (typeVal.includes('エフェクトスタンプ')) {
                        obj.type = 'effect-sticker';
                    } else if (typeVal.includes('ポップアップスタンプ')) {
                        obj.type = 'popup-sticker';
                    } else if (typeVal.includes('動くスタンプ') || typeVal.includes('アニメーションスタンプ')) {
                        obj.type = 'animated-sticker';
                    } else if (typeVal.includes('動く絵文字') || typeVal.includes('アニメーション絵文字')) {
                        obj.type = 'animated-emoji';
                    } else if (typeVal.includes('絵文字')) {
                        obj.type = 'emoji';
                    } else if (typeVal.includes('着せ替え') || typeVal.includes('着せかえ') || typeVal.includes('テーマ')) {
                        obj.type = 'theme';
                    } else {
                        obj.type = 'sticker';
                    }

                    obj.hearts = heartMap[obj.id] || 0;

                    // 推し・プレミアムの有効判定（空欄以外）
                    // バッジ用（値が入っている）と、特集用（現在年月と一致）を分ける
                    obj.isRecommended = obj.pickMonth !== '';
                    obj.isPremium = obj.premiumMonth !== '';

                    const titleText = (obj.title || '').toLowerCase();

                    // 🌺 1. 沖縄系キーワード判定
                    const isOkinawa =
                        titleText.includes('沖縄') ||
                        titleText.includes('okinawa') ||
                        titleText.includes('うちなー') ||
                        titleText.includes('ウチナー') ||
                        titleText.includes('シーサー') ||
                        titleText.includes('shisa') ||
                        titleText.includes('方言') ||
                        titleText.includes('マヤー') ||
                        titleText.includes('まやー') ||
                        titleText.includes('琉球') ||
                        titleText.includes('やんばる');

                    // 🌸 2. 敬語系キーワード判定
                    const isKeigo =
                        titleText.includes('敬語') ||
                        titleText.includes('丁寧') ||
                        titleText.includes('ビジネス') ||
                        titleText.includes('仕事') ||
                        titleText.includes('pta') ||
                        titleText.includes('役員') ||
                        titleText.includes('連絡');

                    if (isOkinawa) {
                        obj.category = 'okinawa';
                    } else if (isKeigo) {
                        obj.category = 'keigo';
                    } else {
                        obj.category = 'others';
                    }

                    return obj;
                }).filter(item => {
                    if (!item.title || !item.url) return false;
                    if (item.type === 'theme') return false;
                    if (!item.date || item.date.trim() === '') return false;

                    const normalizedId = String(item.id).trim();
                    if (EXCLUDE_ITEM_IDS.includes(normalizedId)) return false;

                    const stopKeywords = ['販売停止', '販売終了', '停止中', '販売中止', '非公開', '審査中', 'リジェクト', '申請中', '削除'];
                    if (stopKeywords.some(kw => item.title.includes(kw))) return false;
                    if (item.status && stopKeywords.some(kw => item.status.includes(kw))) return false;
                    if (item.rowText.includes('販売停止') || item.rowText.includes('販売終了') || item.rowText.includes('販売中止')) return false;

                    return true;
                });

                dlog('CSV行数:', masterRaw.length, '/ 有効作品数:', mappedData.length, '/ 列名:', Object.keys(masterRaw[0] || {}));
                dlog('現在年月:', getCurrentYM(), '/ 今月の推し対象:', mappedData.filter(isPickNow).length, '/ 今月のプレミアム対象:', mappedData.filter(isPremiumNow).length);
                dlog('推し月(生値→正規化):', masterRaw.slice(0, 400).map(r => [r['推し月'], normalizeYM(r['推し月'])]).filter(x => x[0]));
                dlog('プレミアム月 正規化後の分布:', mappedData.reduce((o, s) => { if (s.premiumMonth) o[s.premiumMonth] = (o[s.premiumMonth] || 0) + 1; return o; }, {}));
                return mappedData;
            } catch (error) {
                console.error('Error fetching sheets:', error);
                showError();
                return [];
            }
        }

        function render() {
            const grid = document.getElementById('stamp-grid');
            const emptyState = document.getElementById('empty-state');
            const featureComingSoon = document.getElementById('feature-coming-soon');
            grid.innerHTML = '';

            const isFeatureActive = activeFeature !== null || currentCategory === 'recommended';
            if (isFeatureActive && FEATURE_COMING_SOON) {
                grid.classList.add('hidden');
                emptyState.classList.add('hidden');
                featureComingSoon.classList.remove('hidden');
                updateBadgeCounts();
                return;
            }

            featureComingSoon.classList.add('hidden');

            let filtered;
            if (activeFeature !== null) {
                // 🌟 特集表示中：特集条件だけを適用（カテゴリ・種類・検索は一切見ない）
                filtered = allStamps.filter(stamp =>
                    activeFeature === 'recommended' ? isPickNow(stamp) : isPremiumNow(stamp));
            } else {
                // 通常時：カテゴリ + 種類 + 検索
                filtered = allStamps.filter(stamp => {
                    if (currentCategory === 'recommended') {
                        if (!isPickNow(stamp)) return false;
                    } else if (stamp.category !== currentCategory) {
                        return false;
                    }
                    const matchType = currentType === 'all' || stamp.type === currentType;
                    const matchSearch = searchQuery === '' || stamp.title.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchType && matchSearch;
                });
            }

            if (currentSort === 'newest') {
                filtered.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));
            } else if (currentSort === 'hearts') {
                filtered.sort((a, b) => {
                    if (b.hearts !== a.hearts) {
                        return b.hearts - a.hearts;
                    }
                    return new Date(b.date || 0) - new Date(a.date || 0);
                });
            }

            updateBadgeCounts();
            dlog('activeFeature:', activeFeature, '/ 絞り込み後件数:', filtered.length);

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.classList.remove('hidden');

            filtered.forEach(stamp => {
                const today = new Date();
                const releaseDate = stamp.date ? new Date(stamp.date) : null;
                const diffTime = releaseDate ? (today - releaseDate) : 0;
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

                const isNew = diffDays >= 0 && diffDays <= 30;

                const isHot = isNew && stamp.hearts > 0;
                const isClassic = !isNew && stamp.hearts >= 20;

                let badgeLabel = 'スタンプ';
                let badgeStyle = 'bg-pink-50 text-pink-600 border border-pink-100';

                if (stamp.type === 'emoji') {
                    badgeLabel = '絵文字';
                    badgeStyle = 'bg-purple-50 text-purple-600 border border-purple-100';
                } else if (stamp.type === 'animated-sticker') {
                    badgeLabel = '動くスタンプ';
                    badgeStyle = 'bg-rose-50 text-rose-600 border border-rose-100';
                } else if (stamp.type === 'animated-emoji') {
                    badgeLabel = '動く絵文字';
                    badgeStyle = 'bg-indigo-50 text-indigo-600 border border-indigo-100';
                } else if (stamp.type === 'popup-sticker') {
                    badgeLabel = '大きく動くスタンプ';
                    badgeStyle = 'bg-amber-50 text-amber-600 border border-amber-100';
                } else if (stamp.type === 'effect-sticker') {
                    badgeLabel = '背景が大きく動くスタンプ';
                    badgeStyle = 'bg-cyan-50 text-cyan-600 border border-cyan-100';
                }

                // ✨ 推しバッジ
                const recommendBadge = stamp.isRecommended
                    ? `<span class="text-[10px] text-amber-700 font-bold bg-amber-50 border border-amber-200 px-1.5 py-0.5 rounded-full flex items-center gap-0.5"><i class="fa-solid fa-star text-amber-500 text-[9px]"></i>${stamp.pickMonth.replace('-', '.')} 推し</span>`
                    : '';

                // 👑 プレミアムバッジ
                const premiumBadge = stamp.isPremium
                    ? `<span class="text-[10px] text-purple-700 font-bold bg-purple-50 border border-purple-200 px-1.5 py-0.5 rounded-full flex items-center gap-0.5"><i class="fa-solid fa-crown text-purple-500 text-[9px]"></i>${stamp.premiumMonth.replace('-', '.')} プレミアム</span>`
                    : '';

                // 🏷️ 急上昇・定番バッジ
                let trendBadge = '';
                if (isHot) {
                    trendBadge = `<span class="text-[10px] text-orange-600 font-bold bg-orange-50 border border-orange-200 px-1.5 py-0.5 rounded-full flex items-center gap-0.5"><i class="fa-solid fa-fire text-orange-500 text-[9px]"></i>急上昇</span>`;
                } else if (isClassic) {
                    trendBadge = `<span class="text-[10px] text-amber-700 font-bold bg-amber-50 border border-amber-200 px-1.5 py-0.5 rounded-full flex items-center gap-0.5"><i class="fa-solid fa-crown text-amber-500 text-[9px]"></i>定番</span>`;
                }

                const heartBadge = stamp.hearts > 0
                    ? `<span class="text-[10px] text-rose-500 font-bold bg-rose-50 px-1.5 py-0.5 rounded-full flex items-center gap-0.5"><i class="fa-solid fa-heart text-[8px]"></i>${stamp.hearts}</span>`
                    : '';

                const dateHtml = stamp.date
                    ? `<p class="text-[10px] text-gray-400 font-bold flex items-center gap-1 pt-1"><i class="fa-regular fa-calendar-days text-[9px] text-gray-400"></i>${stamp.date} 発売</p>`
                    : '';

                const card = `
                    <a href="${stamp.url}" target="_blank" rel="noopener" 
                       class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-col hover:shadow-md transition duration-200 active:scale-[0.98]">
                        <div class="img-aspect-square bg-white flex items-center justify-center p-3 border-b border-gray-100">
                            <img src="${stamp.img}" alt="${stamp.title}" loading="lazy" class="max-w-full max-h-full object-contain"
                                 onerror="this.onerror=null; this.src='https://placehold.co/150x150/ffffff/cccccc?text=LINE';">
                        </div>
                        <div class="p-3 flex flex-col justify-between flex-grow space-y-2">
                            <div class="space-y-1">
                                <div class="flex items-center justify-between gap-1 flex-wrap">
                                    <div class="flex items-center gap-1 flex-wrap">
                                        <span class="inline-block text-[9px] font-black px-1.5 py-0.5 rounded ${badgeStyle}">${badgeLabel}</span>
                                        ${recommendBadge}
                                        ${premiumBadge}
                                        ${trendBadge}
                                    </div>
                                    ${heartBadge}
                                </div>
                                <h3 class="text-xs font-bold text-gray-800 line-clamp-2 leading-snug h-[34px]">${stamp.title}</h3>
                                ${dateHtml}
                            </div>
                            <div class="flex items-center justify-between text-[10px] text-gray-400 font-bold border-t border-gray-50 pt-2">
                                <span class="text-[#00C300]">LINEストア</span>
                                <i class="fa-solid fa-chevron-right text-[8px] text-[#00C300]"></i>
                            </div>
                        </div>
                    </a>
                `;
                grid.insertAdjacentHTML('beforeend', card);
            });
        }

        function toggleFeature(featureKey) {
            if (activeFeature === featureKey) {
                clearFeature();
                return;
            }

            activeFeature = featureKey;
            updateFeatureUI();
            render();
        }

        function clearFeature() {
            activeFeature = null;
            updateFeatureUI();
            render();
        }

        function updateFeatureUI() {
            const statusText = document.getElementById('feature-status-text');
            const resetBar = document.getElementById('feature-reset-bar');
            const resetLabel = document.getElementById('feature-reset-label');
            const searchContainer = document.getElementById('search-input-container');
            // 特集中はカテゴリタブ・種類フィルターを無効表示（操作不可）にする。値(currentCategory/currentType)は変更しない
            ['category-tab-bar', 'sub-filter-bar'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.classList.toggle('opacity-40', activeFeature !== null);
                    el.classList.toggle('pointer-events-none', activeFeature !== null);
                }
            });

            ['recommended', 'premium'].forEach(key => {
                const btn = document.getElementById(`feature-btn-${key}`);
                if (btn) {
                    if (activeFeature === key) {
                        btn.classList.add('ring-4', 'ring-[#00C300]', 'scale-[1.02]');
                    } else {
                        btn.classList.remove('ring-4', 'ring-[#00C300]', 'scale-[1.02]');
                    }
                }
            });

            if (activeFeature) {
                statusText.classList.remove('hidden');
                resetBar.classList.remove('hidden');
                // 🔍 特集絞り込み中は検索バーを非表示にする
                if (searchContainer) searchContainer.classList.add('hidden');

                let title = '特集';
                if (activeFeature === 'recommended') title = '✨ 今月の推し特集';
                if (activeFeature === 'premium') title = '👑 プレミアム解禁特集';

                resetLabel.innerHTML = `<i class="fa-solid fa-sparkles text-[#00C300]"></i> <strong>${title}</strong> を表示中`;
            } else {
                statusText.classList.add('hidden');
                resetBar.classList.add('hidden');
                // 🔍 通常画面では検索バーを表示する
                if (searchContainer) searchContainer.classList.remove('hidden');
            }
        }

        function changeSort(type) {
            currentSort = type;
            localStorage.setItem('portfolio_sort', type);

            const btnNewest = document.getElementById('sort-newest');
            const btnHearts = document.getElementById('sort-hearts');

            if (type === 'newest') {
                btnNewest.className = 'text-[#00C300] font-bold transition';
                btnHearts.className = 'text-gray-400 hover:text-[#00C300] transition';
            } else {
                btnHearts.className = 'text-[#00C300] font-bold transition';
                btnNewest.className = 'text-gray-400 hover:text-[#00C300] transition';
            }
            if (allStamps.length > 0) render();
        }

        function updateBadgeCounts() {
            const recommendedCount = allStamps.filter(isPickNow).length;
            const okinawaCount = allStamps.filter(s => s.category === 'okinawa').length;
            const keigoCount = allStamps.filter(s => s.category === 'keigo').length;
            const othersCount = allStamps.filter(s => s.category === 'others').length;

            document.getElementById('count-recommended').textContent = recommendedCount;
            document.getElementById('count-okinawa').textContent = okinawaCount;
            document.getElementById('count-keigo').textContent = keigoCount;
            document.getElementById('count-others').textContent = othersCount;
            document.getElementById('total-count').textContent = `全 ${allStamps.length}作品 を配信中！`;
        }

        function switchCategory(category) {
            if (activeFeature) {
                activeFeature = null;
                updateFeatureUI();
            }

            currentCategory = category;
            localStorage.setItem('portfolio_category', category);

            ['recommended', 'okinawa', 'keigo', 'others'].forEach(cat => {
                const tab = document.getElementById(`tab-${cat}`);
                if (tab) {
                    if (cat === category) {
                        tab.classList.add('btn-active');
                    } else {
                        tab.classList.remove('btn-active');
                    }
                }
            });

            if (allStamps.length > 0) render();
        }

        function filterType(type) {
            currentType = type;
            localStorage.setItem('portfolio_type', type);

            ['all', 'sticker', 'animated-sticker', 'popup-sticker', 'effect-sticker', 'emoji', 'animated-emoji'].forEach(t => {
                const btn = document.getElementById(`sub-${t}`);
                if (btn) {
                    if (t === type) {
                        btn.classList.add('btn-active');
                    } else {
                        btn.classList.remove('btn-active');
                    }
                }
            });

            if (allStamps.length > 0) render();
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            render();
        });

        function showError() {
            document.getElementById('loading-placeholder').classList.add('hidden');
            document.getElementById('error-message').classList.remove('hidden');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const savedSort = localStorage.getItem('portfolio_sort') || 'newest';
            const savedCategory = localStorage.getItem('portfolio_category') || 'okinawa';
            const savedType = localStorage.getItem('portfolio_type') || 'all';

            changeSort(savedSort);
            switchCategory(savedCategory);
            filterType(savedType);

            const stamps = await fetchSpreadsheetData();
            allStamps = stamps;

            document.getElementById('loading-placeholder').classList.add('hidden');
            if (stamps && stamps.length > 0) {
                render();
            } else {
                showError();
            }
        });
    </script>
</body>

</html>
